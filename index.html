                    </div>
                    <div>
                      <div style={{ fontSize: '0.7rem', fontWeight: '800', color: '#6B7280' }}>KYC LEVEL</div>
                      <div style={{ fontSize: '0.82rem', fontWeight: '800' }}>{drop.kycRequirement}</div>
                    </div>
                  </div>

                  <button className="btn-pop btn-pop-green" style={{ width: '100%' }} onClick={() => onOpenGuide(drop)}>
                    View NG Execution Guide →
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function App() {
      const [activeTab, setActiveTab] = useState('radar');
      const [drops, setDrops] = useState(INITIAL_DROPS);
      const [selectedGuide, setSelectedGuide] = useState(null);
      const [isSyncing, setIsSyncing] = useState(false);

      const handleAutoSync = async () => {
        setIsSyncing(true);
        try {
          const res = await fetch('./dropsData.json');
          if (res.ok) {
            const data = await res.json();
            if (data.drops && data.drops.length > 0) {
              setDrops(data.drops);
            }
          }
        } catch (e) {
          console.log('Sync fallback active');
        }
        setTimeout(() => setIsSyncing(false), 800);
      };

      useEffect(() => {
        handleAutoSync();
        const timer = setInterval(() => handleAutoSync(), 30000); // auto-sync every 30s
        return () => clearInterval(timer);
      }, []);

      return (
        <div>
          <Navbar activeTab={activeTab} setActiveTab={setActiveTab} dropCount={drops.length} onSync={handleAutoSync} isSyncing={isSyncing} />
          <main>
            {activeTab === 'radar' && <DropRadar drops={drops} onSelectTab={setActiveTab} onOpenGuide={setSelectedGuide} />}
            {activeTab === 'inspector' && <div style={{ padding: '40px', textAlign: 'center' }}>Inspector active</div>}
            {activeTab === 'offramp' && <div style={{ padding: '40px', textAlign: 'center' }}>Naira Calculator active</div>}
          </main>
          {selectedGuide && <GuideModal drop={selectedGuide} onClose={() => setSelectedGuide(null)} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
